<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Instrument Serif'; font-style: normal; src: url('__FONT_SERIF_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('__FONT_SERIF_ITALIC__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 400; src: url('__FONT_SANS_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 700; src: url('__FONT_SANS_BOLD__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 900; src: url('__FONT_SANS_BLACK__') format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1350px;
    background: #f4efe8;
    color: #111111;
    font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    padding: 140px 96px 140px 96px;
    overflow: hidden;
    background: #f4efe8;
  }

  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.4;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.025) 0, transparent 1px),
      radial-gradient(circle at 70% 70%, rgba(0,0,0,0.02) 0, transparent 1px);
    background-size: 3px 3px, 5px 5px;
  }

  .grid-overlay {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(17,17,17,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(17,17,17,0.04) 1px, transparent 1px);
    background-size: 90px 90px;
    pointer-events: none; z-index: 1;
  }

  .crosshair {
    position: absolute; width: 36px; height: 36px; z-index: 2; opacity: 0.5;
  }
  .crosshair::before, .crosshair::after {
    content: ""; position: absolute; background: rgba(17,17,17,0.35);
  }
  .crosshair::before { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-0.5px); }
  .crosshair::after { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-0.5px); }
  .crosshair .ring { position: absolute; inset: 10px; border: 1px solid rgba(17,17,17,0.35); border-radius: 50%; }
  .crosshair.tl { top: 26px; left: 30px; }
  .crosshair.tr { top: 26px; right: 30px; }
  .crosshair.bl { bottom: 26px; left: 30px; }
  .crosshair.br { bottom: 26px; right: 30px; }

  /* Top progress bar */
  .progress {
    position: absolute; top: 74px; left: 96px; right: 96px;
    height: 2px; background: rgba(17,17,17,0.14); z-index: 3;
  }
  .progress .fill {
    position: absolute;
    left: calc(((var(--pcurrent, 0) - 1) / max(var(--ptotal, 1), 1)) * 100%);
    width: calc((1 / max(var(--ptotal, 1), 1)) * 100%);
    top: -2px; height: 6px; background: var(--accent);
  }

  .kicker {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 44px;
    color: var(--accent);
    margin-bottom: 18px;
    position: relative;
    z-index: 3;
    display: block;
  }

  .headline-row {
    display: flex;
    align-items: flex-start;
    gap: 32px;
    position: relative;
    z-index: 3;
    margin-bottom: 36px;
  }

  .numeral {
    font-family: 'Geist', sans-serif;
    font-weight: 900;
    font-size: 176px;
    line-height: 0.9;
    color: var(--accent);
    letter-spacing: -0.04em;
    flex-shrink: 0;
  }

  .headline {
    font-family: 'Geist', sans-serif;
    font-weight: 900;
    font-size: 118px;
    line-height: 0.96;
    letter-spacing: -0.035em;
    color: #111111;
    max-width: 800px;
    margin-top: 16px;
  }

  .headline .accent {
    color: var(--accent);
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
  }

  .subtitle {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 48px;
    line-height: 1.15;
    color: var(--accent);
    max-width: 880px;
    position: relative;
    z-index: 3;
    margin-top: 8px;
    display: inline-block;
  }
  .subtitle::after {
    content: "";
    display: block;
    width: 220px;
    height: 4px;
    background: #111111;
    margin-top: 10px;
    border-radius: 2px;
    transform: skewY(-2deg);
  }

  .sticker {
    position: absolute;
    top: 640px;
    right: 160px;
    background: #1f6feb;
    color: #ffffff;
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 26px;
    padding: 14px 24px 16px 24px;
    border-radius: 40px;
    transform: rotate(-3deg);
    z-index: 4;
    box-shadow: 0 8px 22px rgba(31,111,235,0.35);
  }
  .sticker::after {
    content: "";
    position: absolute;
    bottom: -10px; left: 18px;
    width: 22px; height: 22px;
    background: #1f6feb;
    clip-path: polygon(0 0, 100% 0, 0 100%);
    transform: rotate(-10deg);
  }

  .decorative-char { display: none; }

  .footer {
    position: absolute;
    bottom: 56px;
    left: 96px;
    right: 96px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 3;
  }

  .handle {
    font-family: 'Geist', sans-serif;
    font-weight: 400;
    font-size: 22px;
    color: rgba(17,17,17,0.75);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .handle img { width: 24px; height: 24px; }

  .logo { height: 42px; filter: brightness(0); opacity: 0.85; }

  .page-indicator { display: none; }
</style>
</head>
<body>
<div class="canvas" style="--accent: __ACCENT_COLOR__; --pcurrent: __PROGRESS_CURRENT__; --ptotal: __PROGRESS_TOTAL__;">
  <div class="grid-overlay"></div>
  <div class="grain"></div>

  <div class="crosshair tl"><div class="ring"></div></div>
  <div class="crosshair tr"><div class="ring"></div></div>
  <div class="crosshair bl"><div class="ring"></div></div>
  <div class="crosshair br"><div class="ring"></div></div>

  <div class="progress"><div class="fill"></div></div>

  __KICKER__

  <div class="headline-row">
    <div class="numeral">__DECORATIVE_CHAR_INLINE__</div>
    <h1 class="headline">__HEADLINE__</h1>
  </div>

  __SUBTITLE__

  __STICKER__

  <div class="footer">
    <div class="handle">
      __IG_ICON__
      <span>@__HANDLE__</span>
    </div>
    __LOGO__
  </div>
</div>
</body>
</html>
