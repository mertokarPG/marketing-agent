<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Instrument Serif'; font-style: normal; src: url('__FONT_SERIF_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('__FONT_SERIF_ITALIC__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 400; src: url('__FONT_SANS_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 700; src: url('__FONT_SANS_BOLD__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 900; src: url('__FONT_SANS_BLACK__') format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px; height: 1350px;
    background: #17171c; color: #f2ebdd;
    font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .canvas {
    position: relative; width: 1080px; height: 1350px;
    padding: 150px 96px 140px 96px; overflow: hidden;
    background: #17171c;
  }

  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.35;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.025) 0, transparent 1px),
      radial-gradient(circle at 70% 70%, rgba(255,255,255,0.02) 0, transparent 1px);
    background-size: 3px 3px, 5px 5px;
  }

  .grid-overlay {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 90px 90px;
    pointer-events: none; z-index: 1;
  }

  .crosshair { position: absolute; width: 36px; height: 36px; z-index: 2; opacity: 0.5; }
  .crosshair::before, .crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,0.3); }
  .crosshair::before { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-0.5px); }
  .crosshair::after { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-0.5px); }
  .crosshair .ring { position: absolute; inset: 10px; border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; }
  .crosshair.tl { top: 26px; left: 30px; }
  .crosshair.tr { top: 26px; right: 30px; }
  .crosshair.bl { bottom: 26px; left: 30px; }
  .crosshair.br { bottom: 26px; right: 30px; }

  .progress {
    position: absolute; top: 74px; left: 96px; right: 96px;
    height: 3px; background: rgba(255,255,255,0.14); z-index: 3;
  }
  .progress .fill {
    position: absolute;
    left: calc(((var(--pcurrent, 0) - 1) / max(var(--ptotal, 1), 1)) * 100%);
    width: calc((1 / max(var(--ptotal, 1), 1)) * 100%);
    top: -2px; height: 6px; background: var(--accent);
  }

  .chev {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; z-index: 3;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(242,235,221,0.75);
    font-family: 'Geist', sans-serif; font-weight: 400; font-size: 22px; line-height: 1;
  }
  .chev.left { left: 22px; }
  .chev.right { right: 22px; }

  .kicker {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 42px;
    color: rgba(242,235,221,0.85);
    margin-bottom: 6px;
    position: relative; z-index: 3; display: block;
  }

  .headline {
    font-family: 'Geist', sans-serif;
    font-weight: 900;
    font-size: 88px;
    line-height: 0.98;
    letter-spacing: -0.03em;
    color: #f2ebdd;
    max-width: 860px;
    margin-bottom: 44px;
    position: relative; z-index: 3;
  }
  .headline .accent {
    color: var(--accent);
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
  }

  /* Comparison panels */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    position: relative;
    z-index: 3;
    margin-bottom: 40px;
  }

  .panel-label {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 34px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .panel-label.good { color: #f2ebdd; }
  .panel-label.bad  { color: #ff6e6e; }

  .panel-label .mark {
    width: 32px; height: 32px;
    border: 2px solid currentColor;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 18px;
    line-height: 1;
  }

  .mock {
    border: 1.5px solid rgba(255,255,255,0.45);
    border-radius: 28px;
    padding: 28px;
    background: rgba(255,255,255,0.02);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 20px;
  }
  .mock.bad { gap: 8px; padding-top: 22px; padding-bottom: 22px; }

  .mock .icon {
    width: 88px; height: 88px;
    border: 1.5px solid rgba(255,255,255,0.55);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Geist', sans-serif;
    font-size: 42px;
    color: rgba(255,255,255,0.8);
  }

  .mock .bar {
    height: 22px;
    width: 82%;
    border-radius: 11px;
    background: linear-gradient(to right, rgba(255,255,255,0.5), rgba(255,255,255,0.1));
    position: relative;
  }
  .mock .bar.short { width: 50%; }
  .mock .bar.med   { width: 68%; }
  .mock .bar.hl {
    background: repeating-linear-gradient(
      -45deg,
      var(--accent) 0,
      var(--accent) 4px,
      rgba(17,17,17,0.6) 4px,
      rgba(17,17,17,0.6) 10px
    );
  }

  .mock .button {
    height: 44px;
    width: 60%;
    border-radius: 22px;
    background: linear-gradient(to right, rgba(255,255,255,0.4), rgba(255,255,255,0.08));
    margin-top: 4px;
  }
  .mock.bad .button { margin-top: 0; }

  .note {
    position: relative;
    z-index: 3;
    margin-top: 12px;
    padding: 0 4px;
  }
  .note-label {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 38px;
    color: var(--accent);
    margin-bottom: 8px;
    display: inline-block;
  }
  .note-label::after { content: ":"; }

  .note-text {
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 32px;
    line-height: 1.35;
    color: #f2ebdd;
    max-width: 880px;
  }

  .footer {
    position: absolute;
    bottom: 56px; left: 96px; right: 96px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 3;
  }

  .handle {
    font-family: 'Geist', sans-serif; font-weight: 400; font-size: 22px;
    color: rgba(242,235,221,0.65);
    display: flex; align-items: center; gap: 10px;
  }
  .handle img { width: 24px; height: 24px; filter: brightness(0) invert(1); opacity: 0.65; }
  .logo { height: 42px; filter: brightness(0) invert(1); opacity: 0.85; }

  .page-indicator, .sticker { display: none; }
</style>
</head>
<body>
<div class="canvas" style="--accent: __ACCENT_COLOR__; --pcurrent: __PROGRESS_CURRENT__; --ptotal: __PROGRESS_TOTAL__;">
  <div class="grid-overlay"></div>
  <div class="grain"></div>

  <div class="crosshair tl"><div class="ring"></div></div>
  <div class="crosshair tr"><div class="ring"></div></div>
  <div class="crosshair bl"><div class="ring"></div></div>
  <div class="crosshair br"><div class="ring"></div></div>

  <div class="progress"><div class="fill"></div></div>

  <div class="chev left">‹</div>
  <div class="chev right">›</div>

  __KICKER__

  <h1 class="headline">__HEADLINE__</h1>

  <div class="panels">
    <div>
      <div class="panel-label good"><span class="mark">✓</span> <span>__GOOD_LABEL__</span></div>
      <div class="mock">
        <div class="icon">✧</div>
        <div class="bar"></div>
        <div class="bar med"></div>
        <div class="bar short"></div>
        <div class="button"></div>
      </div>
    </div>
    <div>
      <div class="panel-label bad"><span class="mark">✕</span> <span>__BAD_LABEL__</span></div>
      <div class="mock bad">
        <div class="icon">✧</div>
        <div class="bar hl"></div>
        <div class="bar"></div>
        <div class="bar hl short"></div>
        <div class="button"></div>
      </div>
    </div>
  </div>

  <div class="note">
    <div class="note-label">Note</div>
    <div class="note-text">__NOTE_TEXT__</div>
  </div>

  <div class="footer">
    <div class="handle">
      __IG_ICON__
      <span>@__HANDLE__</span>
    </div>
    __LOGO__
  </div>
</div>
</body>
</html>
