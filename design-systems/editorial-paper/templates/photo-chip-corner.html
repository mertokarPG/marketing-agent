<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Instrument Serif'; font-style: normal; src: url('__FONT_SERIF_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('__FONT_SERIF_ITALIC__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 400; src: url('__FONT_SANS_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 700; src: url('__FONT_SANS_BOLD__') format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1350px;
    font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #111;
  }

  .photo-bg { position: absolute; inset: 0; z-index: 0; }
  .photo-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* Very light top + bottom scrim so logo/handle stays legible on any photo */
  .scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 18%),
      linear-gradient(to top, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 22%);
    z-index: 1;
  }

  /* The hero element — a soft cream chip with a serif callout */
  .chip {
    position: absolute;
    bottom: 160px;
    right: 60px;
    z-index: 3;
    background: rgba(244, 239, 232, 0.96);
    backdrop-filter: blur(6px);
    padding: 24px 32px 26px 32px;
    border-radius: 22px;
    max-width: 560px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .chip .kicker-label {
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .chip .headline {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 40px;
    line-height: 1.12;
    letter-spacing: -0.01em;
    color: #111111;
  }

  .chip .headline .accent {
    color: var(--accent);
    font-style: italic;
  }

  .chip .subtitle {
    font-family: 'Geist', sans-serif;
    font-weight: 400;
    font-size: 18px;
    color: #333333;
    opacity: 0.8;
    margin-top: 4px;
  }

  /* Keep default tokens quiet so they don't render outside the chip */
  .hidden { display: none; }

  .footer {
    position: absolute;
    bottom: 48px;
    left: 48px;
    right: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }

  .handle {
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 10px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.55);
  }

  .handle img { width: 26px; height: 26px; filter: brightness(0) invert(1); }

  .logo {
    height: 40px;
    filter: brightness(0) invert(1);
    opacity: 0.95;
  }

  .page-indicator {
    position: absolute;
    top: 48px;
    right: 48px;
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: #ffffff;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(8px);
    padding: 8px 16px;
    border-radius: 20px;
    z-index: 4;
    border: 1px solid rgba(255,255,255,0.18);
  }
</style>
</head>
<body>
<div class="canvas" style="--accent: __ACCENT_COLOR__;">
  <div class="photo-bg">__PHOTO_BG__</div>
  <div class="scrim"></div>

  __PAGE_INDICATOR__

  <div class="chip">
    <div class="kicker-label">__CHIP_KICKER__</div>
    <h1 class="headline">__HEADLINE__</h1>
    __SUBTITLE__
  </div>

  <div class="hidden">__KICKER__</div>

  <div class="footer">
    <div class="handle">
      __IG_ICON__
      <span>@__HANDLE__</span>
    </div>
    __LOGO__
  </div>
</div>
</body>
</html>
