<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Instrument Serif';
    font-style: normal;
    src: url('__FONT_SERIF_REGULAR__') format('truetype');
  }
  @font-face {
    font-family: 'Instrument Serif';
    font-style: italic;
    src: url('__FONT_SERIF_ITALIC__') format('truetype');
  }
  @font-face {
    font-family: 'Geist';
    font-weight: 400;
    src: url('__FONT_SANS_REGULAR__') format('truetype');
  }
  @font-face {
    font-family: 'Geist';
    font-weight: 700;
    src: url('__FONT_SANS_BOLD__') format('truetype');
  }
  @font-face {
    font-family: 'Geist';
    font-weight: 900;
    src: url('__FONT_SANS_BLACK__') format('truetype');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1350px;
    background: #f4efe8;
    color: __TEXT_COLOR__;
    font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    padding: 72px 80px;
    overflow: hidden;
  }

  .bg-layer { position: absolute; inset: 0; z-index: 0; }

  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, __GRID_COLOR__ 1px, transparent 1px),
      linear-gradient(to bottom, __GRID_COLOR__ 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 1;
  }

  .kicker {
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 120px;
    padding-bottom: 16px;
    border-bottom: 3px solid var(--accent);
    display: inline-block;
    position: relative;
    z-index: 2;
  }

  /* The STAT — giant number/stat in the headline slot. Use Instrument Serif
     at ~500px for ultra-impactful delivery. */
  .headline {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 520px;
    line-height: 0.85;
    letter-spacing: -0.03em;
    color: __TEXT_COLOR__;
    margin-top: 60px;
    margin-bottom: 16px;
    position: relative;
    z-index: 2;
    white-space: nowrap;
  }

  /* Accent word in the headline picks up the gradient-safe accent */
  .headline .accent {
    color: var(--accent);
    font-style: italic;
    display: inline;
  }

  /* Accent bar under the stat */
  .stat-bar {
    width: 240px;
    height: 10px;
    background: var(--accent);
    margin-top: 8px;
    margin-bottom: 60px;
    position: relative;
    z-index: 2;
  }

  .subtitle {
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 44px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: __TEXT_COLOR__;
    max-width: 820px;
    position: relative;
    z-index: 2;
  }

  /* decorative-char unused; sticker allowed */
  .decorative-char { display: none; }

  .sticker {
    position: absolute;
    right: 90px;
    top: 120px;
    background: #2d6cff;
    color: white;
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 26px;
    padding: 14px 26px;
    border-radius: 24px;
    transform: rotate(6deg);
    box-shadow: 0 8px 24px rgba(45, 108, 255, 0.25);
    z-index: 3;
  }

  .footer {
    position: absolute;
    bottom: 48px;
    left: 80px;
    right: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }

  .handle {
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: __TEXT_COLOR__;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .handle img { width: 28px; height: 28px; }

  .logo {
    height: 48px;
    width: auto;
    filter: __LOGO_FILTER__;
  }

  .page-indicator {
    position: absolute;
    top: 48px;
    right: 80px;
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: __TEXT_COLOR__;
    background: __PAGE_INDICATOR_BG__;
    padding: 8px 16px;
    border-radius: 20px;
    z-index: 3;
  }
</style>
</head>
<body>
<div class="canvas" style="--accent: __ACCENT_COLOR__;">
  <div class="bg-layer">__BG_LAYER__</div>
  __GRID__

  __PAGE_INDICATOR__

  __DECORATIVE_CHAR__

  __KICKER__

  <h1 class="headline">__HEADLINE__</h1>
  <div class="stat-bar"></div>

  __SUBTITLE__

  __STICKER__

  <div class="footer">
    <div class="handle">
      __IG_ICON__
      <span>@__HANDLE__</span>
    </div>
    __LOGO__
  </div>
</div>
</body>
</html>
