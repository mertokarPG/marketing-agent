<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Instrument Serif'; font-style: normal; src: url('__FONT_SERIF_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('__FONT_SERIF_ITALIC__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 400; src: url('__FONT_SANS_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 700; src: url('__FONT_SANS_BOLD__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 900; src: url('__FONT_SANS_BLACK__') format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1350px;
    background: #17171c;
    color: #f2ebdd;
    font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    padding: 120px 96px 140px 96px;
    overflow: hidden;
    background: #17171c;
  }

  /* Paper grain */
  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.35;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.025) 0, transparent 1px),
      radial-gradient(circle at 70% 70%, rgba(255,255,255,0.02) 0, transparent 1px),
      radial-gradient(circle at 45% 85%, rgba(255,255,255,0.025) 0, transparent 1px);
    background-size: 3px 3px, 5px 5px, 4px 4px;
  }

  /* Faint grid lines */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 90px 90px;
    pointer-events: none;
    z-index: 1;
  }

  /* Corner crosshair registration marks — editorial/print-design feel */
  .crosshair {
    position: absolute;
    width: 36px;
    height: 36px;
    z-index: 2;
    opacity: 0.55;
  }
  .crosshair::before, .crosshair::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.35);
  }
  .crosshair::before { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-0.5px); }
  .crosshair::after { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-0.5px); }
  .crosshair .ring {
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 50%;
  }
  .crosshair.tl { top: 26px; left: 30px; }
  .crosshair.tr { top: 26px; right: 30px; }
  .crosshair.bl { bottom: 26px; left: 30px; }
  .crosshair.br { bottom: 26px; right: 30px; }

  .kicker {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 38px;
    color: var(--accent);
    margin-bottom: 28px;
    position: relative;
    z-index: 3;
    display: inline-block;
  }
  .kicker::after {
    content: "";
    display: block;
    width: 72px;
    height: 2px;
    background: var(--accent);
    margin-top: 4px;
    opacity: 0.7;
  }

  .headline {
    font-family: 'Geist', sans-serif;
    font-weight: 900;
    font-size: 136px;
    line-height: 0.96;
    letter-spacing: -0.035em;
    color: #f2ebdd;
    max-width: 920px;
    margin-bottom: 28px;
    position: relative;
    z-index: 3;
  }

  .headline .accent {
    color: #f2ebdd;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.02em;
    position: relative;
    padding: 0 8px;
    margin-left: 6px;
  }
  /* Dashed accent bracket around the serif accent word — mimics the cyan selection box */
  .headline .accent::before {
    content: "";
    position: absolute;
    inset: -6px -4px -10px -4px;
    border: 2px dashed var(--accent);
    border-radius: 4px;
    opacity: 0.85;
    pointer-events: none;
  }

  .subtitle {
    font-family: 'Geist', sans-serif;
    font-weight: 400;
    font-size: 28px;
    line-height: 1.35;
    color: rgba(242,235,221,0.78);
    max-width: 780px;
    margin-top: 28px;
    position: relative;
    z-index: 3;
  }

  /* Blue accent sticker — anchored to the bottom-right above the footer so it
     never collides with the headline regardless of headline wrap. Reads as a
     stamp/badge pinned to the slide. The tail points down-left toward the
     handle, tying it into the footer band. */
  .sticker {
    position: absolute;
    bottom: 180px;
    right: 64px;
    max-width: 320px;
    background: #1f6feb;
    color: #ffffff;
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 28px;
    line-height: 1.15;
    padding: 16px 26px 18px 26px;
    border-radius: 40px;
    transform: rotate(-4deg);
    z-index: 4;
    box-shadow: 0 8px 24px rgba(31,111,235,0.4);
  }
  .sticker::after {
    content: "";
    position: absolute;
    bottom: -12px;
    left: 18px;
    width: 24px;
    height: 24px;
    background: #1f6feb;
    clip-path: polygon(0 0, 100% 0, 0 100%);
    transform: rotate(-10deg);
  }

  .decorative-char {
    display: none;
  }

  .footer {
    position: absolute;
    bottom: 56px;
    left: 96px;
    right: 96px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 3;
  }

  .handle {
    font-family: 'Geist', sans-serif;
    font-weight: 400;
    font-size: 22px;
    color: rgba(242,235,221,0.65);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .handle img { width: 24px; height: 24px; filter: brightness(0) invert(1); opacity: 0.65; }

  .logo {
    height: 42px;
    filter: brightness(0) invert(1);
    opacity: 0.85;
  }

  .page-indicator {
    position: absolute;
    top: 56px;
    right: 90px;
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: rgba(242,235,221,0.85);
    background: rgba(255,255,255,0.08);
    padding: 6px 14px;
    border-radius: 18px;
    z-index: 4;
    border: 1px solid rgba(255,255,255,0.12);
  }

  /* Third-party brand logo (OpenAI, Anthropic, Figma, etc.) — sits above the
     kicker/headline as a visual anchor for trend-reaction posts. Empty when
     no brandLogoPath is provided. Caller is responsible for requesting the
     'light' theme from get_brand_logo so the mark reads on this dark bg. */
  .brand-logo-band {
    position: relative;
    z-index: 3;
    margin-bottom: 44px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .brand-logo-band::before {
    content: "";
    display: block;
    width: 56px;
    height: 2px;
    background: var(--accent);
    opacity: 0.8;
  }
  .brand-logo {
    max-height: 96px;
    max-width: 420px;
    object-fit: contain;
    display: block;
  }
</style>
</head>
<body>
<div class="canvas" style="--accent: __ACCENT_COLOR__;">
  <div class="grid-overlay"></div>
  <div class="grain"></div>

  <div class="crosshair tl"><div class="ring"></div></div>
  <div class="crosshair tr"><div class="ring"></div></div>
  <div class="crosshair bl"><div class="ring"></div></div>
  <div class="crosshair br"><div class="ring"></div></div>

  __PAGE_INDICATOR__

  __BRAND_LOGO__

  __KICKER__

  <h1 class="headline">__HEADLINE__</h1>

  __SUBTITLE__

  __STICKER__

  __DECORATIVE_CHAR__

  <div class="footer">
    <div class="handle">
      __IG_ICON__
      <span>@__HANDLE__</span>
    </div>
    __LOGO__
  </div>
</div>
</body>
</html>
