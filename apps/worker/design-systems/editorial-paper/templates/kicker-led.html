<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Instrument Serif'; font-style: normal; src: url('__FONT_SERIF_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('__FONT_SERIF_ITALIC__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 400; src: url('__FONT_SANS_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 700; src: url('__FONT_SANS_BOLD__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 900; src: url('__FONT_SANS_BLACK__') format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1350px;
    background: #f4efe8;
    color: __TEXT_COLOR__;
    font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    padding: 120px 80px;
    overflow: hidden;
  }

  .bg-layer { position: absolute; inset: 0; z-index: 0; }

  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, __GRID_COLOR__ 1px, transparent 1px),
      linear-gradient(to bottom, __GRID_COLOR__ 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 1;
  }

  /* Kicker becomes the hero — oversized editorial section header */
  .kicker {
    font-family: 'Geist', sans-serif;
    font-weight: 900;
    font-size: 96px;
    line-height: 1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--accent);
    position: relative;
    z-index: 2;
    margin-top: 100px;
    max-width: 900px;
    padding-top: 24px;
    border-top: 6px solid var(--accent);
  }

  /* Headline is the single-line body — minimal */
  .headline {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 64px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: __TEXT_COLOR__;
    margin-top: 80px;
    max-width: 780px;
    position: relative;
    z-index: 2;
  }

  .headline .accent {
    color: var(--accent);
    font-style: italic;
  }

  /* Subtitle is tiny, almost a signature */
  .subtitle {
    font-family: 'Geist', sans-serif;
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: __SUBTITLE_COLOR__;
    margin-top: 60px;
    max-width: 680px;
    position: relative;
    z-index: 2;
  }

  /* Huge index number in the bottom-right — "01" feeling */
  .decorative-char {
    position: absolute;
    right: 60px;
    bottom: 160px;
    font-family: 'Instrument Serif', serif;
    font-size: 340px;
    line-height: 0.85;
    color: var(--accent);
    opacity: 0.22;
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }

  .sticker { display: none; }

  .footer {
    position: absolute;
    bottom: 48px;
    left: 80px;
    right: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }

  .handle {
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: __TEXT_COLOR__;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .handle img { width: 28px; height: 28px; }

  .logo {
    height: 48px;
    width: auto;
    filter: __LOGO_FILTER__;
  }

  .page-indicator {
    position: absolute;
    top: 48px;
    right: 80px;
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: __TEXT_COLOR__;
    background: __PAGE_INDICATOR_BG__;
    padding: 8px 16px;
    border-radius: 20px;
    z-index: 3;
  }
</style>
</head>
<body>
<div class="canvas" style="--accent: __ACCENT_COLOR__;">
  <div class="bg-layer">__BG_LAYER__</div>
  __GRID__

  __PAGE_INDICATOR__

  __DECORATIVE_CHAR__

  __KICKER__

  <h1 class="headline">__HEADLINE__</h1>

  __SUBTITLE__

  __STICKER__

  <div class="footer">
    <div class="handle">
      __IG_ICON__
      <span>@__HANDLE__</span>
    </div>
    __LOGO__
  </div>
</div>
</body>
</html>
