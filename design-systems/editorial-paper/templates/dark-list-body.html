<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Instrument Serif'; font-style: normal; src: url('__FONT_SERIF_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('__FONT_SERIF_ITALIC__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 400; src: url('__FONT_SANS_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 700; src: url('__FONT_SANS_BOLD__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 900; src: url('__FONT_SANS_BLACK__') format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1350px;
    background: #17171c;
    color: #f2ebdd;
    font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    padding: 150px 96px 140px 96px;
    overflow: hidden;
    background: #17171c;
  }

  /* Grain */
  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.35;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.025) 0, transparent 1px),
      radial-gradient(circle at 70% 70%, rgba(255,255,255,0.02) 0, transparent 1px),
      radial-gradient(circle at 45% 85%, rgba(255,255,255,0.025) 0, transparent 1px);
    background-size: 3px 3px, 5px 5px, 4px 4px;
  }

  /* Faint grid */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 90px 90px;
    pointer-events: none;
    z-index: 1;
  }

  /* Corner crosshairs */
  .crosshair {
    position: absolute;
    width: 36px;
    height: 36px;
    z-index: 2;
    opacity: 0.5;
  }
  .crosshair::before, .crosshair::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.3);
  }
  .crosshair::before { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-0.5px); }
  .crosshair::after { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-0.5px); }
  .crosshair .ring {
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 50%;
  }
  .crosshair.tl { top: 26px; left: 30px; }
  .crosshair.tr { top: 26px; right: 30px; }
  .crosshair.bl { bottom: 26px; left: 30px; }
  .crosshair.br { bottom: 26px; right: 30px; }

  /* TOP CAROUSEL PROGRESS INDICATOR — full-width thin track + accent segment at page position */
  .progress {
    position: absolute;
    top: 74px;
    left: 96px;
    right: 96px;
    height: 3px;
    background: rgba(255,255,255,0.14);
    z-index: 3;
    overflow: visible;
  }
  .progress .fill {
    position: absolute;
    left: calc(((var(--pcurrent, 0) - 1) / max(var(--ptotal, 1), 1)) * 100%);
    width: calc((1 / max(var(--ptotal, 1), 1)) * 100%);
    top: -2px;
    height: 6px;
    background: var(--accent);
    border-radius: 1px;
  }

  /* Side carousel arrows — subtle swipe affordance */
  .chev {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    z-index: 3;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(242,235,221,0.75);
    font-family: 'Geist', sans-serif;
    font-weight: 400;
    font-size: 22px;
    line-height: 1;
  }
  .chev.left { left: 22px; }
  .chev.right { right: 22px; }

  /* Small kicker like "Font 3" in the reference — serif, subtle */
  .kicker {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-style: normal;
    font-size: 44px;
    color: rgba(242,235,221,0.85);
    margin-bottom: 8px;
    position: relative;
    z-index: 3;
    display: block;
  }

  .headline {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 112px;
    line-height: 1.0;
    letter-spacing: -0.025em;
    color: #f2ebdd;
    max-width: 900px;
    margin-bottom: 48px;
    position: relative;
    z-index: 3;
  }

  .headline .accent {
    color: var(--accent);
    font-style: italic;
  }

  /* Pill chip row — for taxonomies or example tokens. Rendered when subtitle contains ' | '. */
  .chip-row {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 56px;
    position: relative;
    z-index: 3;
  }
  .chip {
    border: 1px solid rgba(242,235,221,0.5);
    border-radius: 40px;
    padding: 14px 28px;
    font-family: 'Geist', sans-serif;
    font-weight: 400;
    font-size: 28px;
    color: #f2ebdd;
  }

  /* Subtitle when no pills */
  .subtitle {
    font-family: 'Geist', sans-serif;
    font-weight: 400;
    font-size: 28px;
    line-height: 1.4;
    color: rgba(242,235,221,0.78);
    max-width: 820px;
    margin-bottom: 48px;
    position: relative;
    z-index: 3;
  }

  /* Details label — small serif handwritten feel */
  .details-label {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 32px;
    color: rgba(242,235,221,0.9);
    margin-top: 28px;
    margin-bottom: 20px;
    position: relative;
    z-index: 3;
  }
  .details-label::after {
    content: ":";
  }

  /* Bulleted list with accent-arrow bullets — rendered when decorativeChar contains list items separated by ' | ' */
  .bullet-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: relative;
    z-index: 3;
  }
  .bullet-list li {
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 40px;
    line-height: 1.2;
    color: #f2ebdd;
    display: flex;
    align-items: flex-start;
    gap: 22px;
  }
  .bullet-list li::before {
    content: "→";
    color: var(--accent);
    font-weight: 700;
    font-size: 42px;
    line-height: 1;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .sticker { display: none; }

  .footer {
    position: absolute;
    bottom: 56px;
    left: 96px;
    right: 96px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 3;
  }

  .handle {
    font-family: 'Geist', sans-serif;
    font-weight: 400;
    font-size: 22px;
    color: rgba(242,235,221,0.65);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .handle img { width: 24px; height: 24px; filter: brightness(0) invert(1); opacity: 0.65; }

  .logo {
    height: 42px;
    filter: brightness(0) invert(1);
    opacity: 0.85;
  }

  /* Hide redundant page-indicator pill since the top bar covers position */
  .page-indicator { display: none; }
</style>
</head>
<body>
<div class="canvas" style="--accent: __ACCENT_COLOR__; --pcurrent: __PROGRESS_CURRENT__; --ptotal: __PROGRESS_TOTAL__;">
  <div class="grid-overlay"></div>
  <div class="grain"></div>

  <div class="crosshair tl"><div class="ring"></div></div>
  <div class="crosshair tr"><div class="ring"></div></div>
  <div class="crosshair bl"><div class="ring"></div></div>
  <div class="crosshair br"><div class="ring"></div></div>

  <div class="progress"><div class="fill"></div></div>

  <div class="chev left">‹</div>
  <div class="chev right">›</div>

  __PAGE_INDICATOR__

  __KICKER__

  <h1 class="headline">__HEADLINE__</h1>

  __DETAILS__

  <div class="footer">
    <div class="handle">
      __IG_ICON__
      <span>@__HANDLE__</span>
    </div>
    __LOGO__
  </div>
</div>
</body>
</html>
