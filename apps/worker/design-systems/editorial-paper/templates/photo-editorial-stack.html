<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Instrument Serif'; font-style: normal; src: url('__FONT_SERIF_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('__FONT_SERIF_ITALIC__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 400; src: url('__FONT_SANS_REGULAR__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 700; src: url('__FONT_SANS_BOLD__') format('truetype'); }
  @font-face { font-family: 'Geist'; font-weight: 900; src: url('__FONT_SANS_BLACK__') format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1350px;
    font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #111;
  }

  .photo-bg { position: absolute; inset: 0; z-index: 0; }
  .photo-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* Top-to-bottom scrim biased to upper portion for headline legibility */
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.72) 0%,
      rgba(0,0,0,0.35) 45%,
      rgba(0,0,0,0) 70%,
      rgba(0,0,0,0.4) 100%
    );
    z-index: 1;
  }

  .content {
    position: absolute;
    top: 140px;
    left: 80px;
    right: 80px;
    z-index: 2;
  }

  .kicker {
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 36px;
    padding-bottom: 16px;
    border-bottom: 3px solid var(--accent);
    display: inline-block;
  }

  .headline {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 96px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    color: #ffffff;
    max-width: 900px;
    margin-bottom: 36px;
    text-shadow: 0 4px 22px rgba(0,0,0,0.55);
  }

  .headline .accent {
    color: var(--accent);
    font-style: italic;
  }

  .subtitle {
    font-family: 'Geist', sans-serif;
    font-weight: 400;
    font-size: 28px;
    line-height: 1.4;
    color: rgba(255,255,255,0.92);
    max-width: 820px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }

  .decorative-char, .sticker { display: none; }

  .footer {
    position: absolute;
    bottom: 48px;
    left: 48px;
    right: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 3;
  }

  .handle {
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 10px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.55);
  }

  .handle img { width: 26px; height: 26px; filter: brightness(0) invert(1); }

  .logo {
    height: 40px;
    filter: brightness(0) invert(1);
    opacity: 0.95;
  }

  .page-indicator {
    position: absolute;
    top: 48px;
    right: 48px;
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: #ffffff;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(8px);
    padding: 8px 16px;
    border-radius: 20px;
    z-index: 4;
    border: 1px solid rgba(255,255,255,0.18);
  }
</style>
</head>
<body>
<div class="canvas" style="--accent: __ACCENT_COLOR__;">
  <div class="photo-bg">__PHOTO_BG__</div>
  <div class="scrim"></div>

  __PAGE_INDICATOR__

  <div class="content">
    __KICKER__
    <h1 class="headline">__HEADLINE__</h1>
    __SUBTITLE__
  </div>

  <div class="footer">
    <div class="handle">
      __IG_ICON__
      <span>@__HANDLE__</span>
    </div>
    __LOGO__
  </div>
</div>
</body>
</html>
